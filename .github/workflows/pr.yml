# Runs on every pull request: the checks documented in CLAUDE.md's
# "Commands" section, since that's the closest thing this project has to a
# test suite. GitHub's runners have no LXD/Incus daemon, so everything that
# needs one runs in the `daemon` job on a self-hosted runner (see
# docs/development.md); anything beyond its smoke test is still verified by
# hand against a real daemon, as CLAUDE.md describes.
name: PR

on:
  pull_request:
  workflow_dispatch:

# A new push to the PR supersedes the run already in flight for it.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commit-style:
    name: PR title is a conventional commit
    # First, and everything else needs it: a title that would release nothing
    # is the cheapest thing to get wrong and to fix, so it fails in seconds
    # rather than after every other job has run. The `if:` is on the step, not
    # the job -- a skipped job would skip every job that needs it, and a manual
    # run has no title to check.
    runs-on: ubuntu-latest
    steps:
      - name: Check the title release-please will read
        if: github.event_name == 'pull_request'
        # A squash merge takes the PR title as the commit subject, and that
        # subject is the entire input to the next version number -- an
        # unparseable one silently releases nothing. See docs/development.md.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|deps|build|ci|chore|style|test|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must be a conventional commit, e.g. 'feat(web): add a bulk stop button'."
            echo "::error::Got: $TITLE"
            exit 1
          fi

  python:
    name: Python (${{ matrix.python-version }})
    needs: commit-style
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject.toml's requires-python and the two newest
        # releases -- `from __future__ import annotations` is what keeps every
        # module syntax-valid on 3.10, and compileall below is what actually
        # checks it. Move the two newest along when a Python is released.
        python-version: ["3.10", "3.14", "3.15"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (no post-3.10 syntax; see CLAUDE.md "Hard constraints")
        run: python3 -m compileall -q src/waterpump

      - name: Import every module
        # compileall only parses; it will not catch an accidentally-added
        # third-party import (dependencies = [] in pyproject.toml is a hard
        # constraint) or any other error that only surfaces at import time.
        # A fresh setup-python install has nothing but the stdlib, so this
        # fails loudly if a module reaches outside it. Deprecations are errors
        # so an API on its way out fails here on the newest Python, the first
        # to warn, rather than on the release that removes it.
        run: python3 -W error::DeprecationWarning .github/scripts/check_imports.py

      - name: CLI parser builds, every command's help formats
        run: python3 -W error::DeprecationWarning .github/scripts/check_cli.py

  compat:
    name: Python 3.10 API floor (vermin)
    needs: commit-style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: No stdlib API newer than requires-python
        # The 3.10 matrix entry only parses and imports, so a newer API used
        # inside a function -- datetime.UTC, itertools.batched -- passes there
        # and fails only when that code runs on a 3.10 host. vermin knows
        # when each stdlib member arrived. It is a CI tool only: nothing
        # waterpump runs depends on it. No --eval-annotations, since every
        # module has `from __future__ import annotations` and they never run.
        run: |
          python3 -m pip install --quiet vermin==1.9.1
          vermin --target=3.10- --violations --no-tips src/waterpump .github/scripts waterpump

  modules:
    name: Bootstrap modules (POSIX sh)
    needs: commit-style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sh -n every module
        # Modules run under /bin/sh in the container -- dash on Debian/Ubuntu,
        # busybox ash on Alpine -- never bash, which minimal images often lack.
        # ubuntu-latest's /bin/sh is dash, so this is the same check CLAUDE.md
        # tells a contributor to run by hand.
        run: |
          status=0
          for f in modules/*.sh; do
            if ! sh -n "$f"; then
              echo "::error file=$f::does not parse as POSIX sh"
              status=1
            fi
          done
          exit "$status"

  web:
    name: Web (lint, typecheck, build)
    needs: commit-style
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Lint (oxlint)
        run: npm run lint
        working-directory: web

      - name: Typecheck and build (./build.sh)
        # Via build.sh rather than npm directly, so the script a clone is told
        # to run is the one CI proves still works. npm ci above already
        # populated node_modules, so it goes straight to the build.
        run: ./build.sh

      - name: Release archive assembles
        # web/dist is no longer committed, so the release archive is the only
        # thing that ships a runnable tree -- and the release workflow only
        # ever runs after a merge, too late to find out it is broken. Build
        # the same archive here, from the dist just built above.
        run: |
          .github/scripts/bundle.sh 0.0.0-pr "$RUNNER_TEMP/bundle"
          tar xzf "$RUNNER_TEMP/bundle/waterpump-0.0.0-pr.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/waterpump-0.0.0-pr"
          test -f web/dist/index.html
          ./waterpump --help > /dev/null

  daemon:
    name: Live daemon
    # The one job with a real daemon, in its own workflow (daemon.yml): a
    # small Debian 13 VM with Incus, running a self-hosted runner. It waits
    # for the hosted jobs, so a change that fails those never takes the one
    # runner's time. The repo is public and that VM's runner user is in
    # incus-admin (root-equivalent), so a fork's PR never gets here -- it
    # would be running its own code on our host. Same-repo PRs and manual runs
    # only; a fork's change is checked here after it is pushed to a branch.
    needs: [python, compat, modules, web]
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    uses: ./.github/workflows/daemon.yml
