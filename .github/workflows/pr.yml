# Runs on every pull request: the checks documented in CLAUDE.md's
# "Commands" section, since that's the closest thing this project has to a
# test suite. There is no live LXD/Incus daemon here, so nothing that needs
# one (`lemondx status`, `create`, etc.) runs -- see CLAUDE.md for how to
# verify those by hand against a real daemon.
name: PR

on:
  pull_request:
  workflow_dispatch:

# A new push to the PR supersedes the run already in flight for it.
concurrency:
  group: pr-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: Python (${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor from pyproject.toml's requires-python, and a recent one --
        # `from __future__ import annotations` is what keeps every module
        # syntax-valid on 3.9, and compileall below is what actually checks it.
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Syntax check (no post-3.9 syntax; see CLAUDE.md "Hard constraints")
        run: python3 -m compileall -q src/lemondx

      - name: Import every module
        # compileall only parses; it will not catch an accidentally-added
        # third-party import (dependencies = [] in pyproject.toml is a hard
        # constraint) or any other error that only surfaces at import time.
        # A fresh setup-python install has nothing but the stdlib, so this
        # fails loudly if a module reaches outside it.
        run: python3 .github/scripts/check_imports.py

      - name: CLI parser builds cleanly (./lemondx --help)
        # build_parser() constructs every subcommand eagerly, so this alone
        # catches things like two subcommands accidentally claiming the same
        # short flag -- argparse raises before anything is even printed.
        run: ./lemondx --help

  modules:
    name: Bootstrap modules (POSIX sh)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: sh -n every module
        # Modules run under /bin/sh in the container -- dash on Debian/Ubuntu,
        # busybox ash on Alpine -- never bash, which minimal images often lack.
        # ubuntu-latest's /bin/sh is dash, so this is the same check CLAUDE.md
        # tells a contributor to run by hand.
        run: |
          status=0
          for f in modules/*.sh; do
            if ! sh -n "$f"; then
              echo "::error file=$f::does not parse as POSIX sh"
              status=1
            fi
          done
          exit "$status"

  web:
    name: Web (lint, typecheck, build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - run: npm ci
        working-directory: web

      - name: Lint (oxlint)
        run: npm run lint
        working-directory: web

      - name: Typecheck and build (./build.sh)
        # Via build.sh rather than npm directly, so the script a clone is told
        # to run is the one CI proves still works. npm ci above already
        # populated node_modules, so it goes straight to the build.
        run: ./build.sh

      - name: Release archive assembles
        # web/dist is no longer committed, so the release archive is the only
        # thing that ships a runnable tree -- and the release workflow only
        # ever runs after a merge, too late to find out it is broken. Build
        # the same archive here, from the dist just built above.
        run: |
          .github/scripts/bundle.sh 0.0.0-pr "$RUNNER_TEMP/bundle"
          tar xzf "$RUNNER_TEMP/bundle/lemondx-0.0.0-pr.tar.gz" -C "$RUNNER_TEMP"
          cd "$RUNNER_TEMP/lemondx-0.0.0-pr"
          test -f web/dist/index.html
          ./lemondx --help > /dev/null

  commit-style:
    name: PR title is a conventional commit
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - name: Check the title release-please will read
        # A squash merge takes the PR title as the commit subject, and that
        # subject is the entire input to the next version number -- an
        # unparseable one silently releases nothing. See docs/development.md.
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if printf '%s' "$TITLE" | grep -Eq '^(feat|fix|perf|refactor|docs|deps|build|ci|chore|style|test|revert)(\([a-z0-9._/-]+\))?!?: .+'; then
            echo "ok: $TITLE"
          else
            echo "::error::PR title must be a conventional commit, e.g. 'feat(web): add a bulk stop button'."
            echo "::error::Got: $TITLE"
            exit 1
          fi
