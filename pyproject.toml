[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lemondx"
version = "0.9.2"
description = "Application orchestration on LXD and Incus: staged, multi-node stacks of instance templates"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []          # stdlib only, by design

[project.scripts]
lemondx = "lemondx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
