[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lemondx"
version = "0.7.0"
description = "Web UI and CLI for managing local LXC/LXD containers"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []          # stdlib only, by design

[project.scripts]
lemondx = "lemondx.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
